<!DOCTYPE html>
<html>
  <head>
    <title>AutoDori WebUI</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center">AutoDori WebUI</h1>

      <ul class="nav nav-tabs mt-4" id="modeTabs" role="tablist">
        <li class="nav-item">
          <a
            class="nav-link active"
            id="fullauto-tab"
            data-toggle="tab"
            href="#fullauto"
            role="tab"
            aria-controls="fullauto"
            aria-selected="true"
            >全自动模式</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            id="semiauto-tab"
            data-toggle="tab"
            href="#semiauto"
            role="tab"
            aria-controls="semiauto"
            aria-selected="false"
            >半自动模式</a
          >
        </li>
      </ul>

      <div class="tab-content" id="modeTabsContent">
        <!-- 全自动模式 -->
        <div
          class="tab-pane fade show active"
          id="fullauto"
          role="tabpanel"
          aria-labelledby="fullauto-tab"
        >
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">全自动模式</h5>
              <p class="card-text">
                从主界面开始，自动选择歌曲并进行游戏。
              </p>
              <div class="form-group">
                <label for="difficulty">难度</label>
                <select class="form-control" id="difficulty">
                  <option value="easy">Easy</option>
                  <option value="normal">Normal</option>
                  <option value="hard" selected>Hard</option>
                  <option value="expert">Expert</option>
                  <option value="special">Special</option>
                </select>
              </div>
              <div class="form-group">
                <label for="livemode">Live模式</label>
                <select class="form-control" id="livemode">
                  <option value="freelive" selected>自由演出</option>
                  <option value="challengelive">挑战演出</option>
                </select>
              </div>
              <div class="form-group">
                <label for="liveboost">最低Live Boost</label>
                <input
                  type="number"
                  class="form-control"
                  id="liveboost"
                  value="1"
                />
              </div>
              <button id="startButton" class="btn btn-primary">开始</button>
            </div>
          </div>
        </div>

        <!-- 半自动模式 -->
        <div
          class="tab-pane fade"
          id="semiauto"
          role="tabpanel"
          aria-labelledby="semiauto-tab"
        >
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">半自动模式</h5>
              <p class="card-text">
                请在游戏中手动选择歌曲和难度，进入
                <strong>队伍确认界面</strong>
                后，在此处开始任务。
              </p>

              <div class="form-group">
                <label for="songNameInput">歌曲名称</label>
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control"
                    id="songNameInput"
                    placeholder="请在游戏中复制歌曲名后点击右侧按钮"
                    readonly
                  />
                  <div class="input-group-append">
                    <button
                      class="btn btn-outline-secondary"
                      type="button"
                      id="recognizeClipboardBtn"
                    >
                      识别剪贴板
                    </button>
                  </div>
                </div>
              </div>

              <div class="form-group">
                <label for="difficultySemiAuto">难度</label>
                <select class="form-control" id="difficultySemiAuto">
                  <option value="easy">Easy</option>
                  <option value="normal">Normal</option>
                  <option value="hard" selected>Hard</option>
                  <option value="expert">Expert</option>
                  <option value="special">Special</option>
                </select>
              </div>

              <button id="startSemiAutoBtn" class="btn btn-success">
                开始执行
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-4">
        <h3>日志</h3>
        <pre
          id="log"
          style="
            height: 300px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #f5f5f5;
          "
        ></pre>
      </div>

      <div id="status" class="mt-2"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
      $(document).ready(function () {
        // --- 通用函数 ---
        function updateStatus() {
          $.get("/status", function (data) {
            if (data.is_running) {
              $("#status").html(
                '<div class="alert alert-success">状态: 运行中</div>'
              );
              $("#startButton, #startSemiAutoBtn").prop("disabled", true);
            } else {
              $("#status").html(
                '<div class="alert alert-info">状态: 待命</div>'
              );
              $("#startButton, #startSemiAutoBtn").prop("disabled", false);
            }
          });
        }

        const logElement = document.getElementById("log");
        const eventSource = new EventSource("/log");
        eventSource.onmessage = function (event) {
          logElement.innerHTML += event.data;
          logElement.scrollTop = logElement.scrollHeight;
        };

        setInterval(updateStatus, 1000);
        updateStatus();

        // --- 全自动模式 ---
        $("#startButton").click(function () {
          const difficulty = $("#difficulty").val();
          const livemode = $("#livemode").val();
          const liveboost = $("#liveboost").val();
          $.ajax({
            url: "/start",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
              mode: "full",
              difficulty: difficulty,
              livemode: livemode,
              liveboost: parseInt(liveboost),
            }),
            success: function (response) {
              if (response.success) {
                logElement.innerHTML += "全自动任务已开始...\n";
              } else {
                logElement.innerHTML += "错误: " + response.message + "\n";
              }
              updateStatus();
            },
          });
        });

        // --- 半自动模式 ---
        $("#recognizeClipboardBtn").click(function () {
          const btn = $(this);
          btn.prop("disabled", true).text("识别中...");
          $.ajax({
            url: "/recognize_clipboard",
            type: "POST",
            success: function (response) {
              if (response.success) {
                $("#songNameInput").val(response.song_name);
                logElement.innerHTML +=
                  "歌曲识别成功: " + response.song_name + "\n";
              } else {
                alert("识别失败: " + response.message);
                logElement.innerHTML += "错误: " + response.message + "\n";
              }
            },
            error: function () {
              alert("请求后端失败。");
              logElement.innerHTML += "错误: /recognize_clipboard 请求失败\n";
            },
            complete: function () {
              btn.prop("disabled", false).text("识别剪贴板");
            },
          });
        });

        $("#startSemiAutoBtn").click(function () {
          const songName = $("#songNameInput").val();
          const difficulty = $("#difficultySemiAuto").val();
          if (!songName) {
            alert("请先从剪贴板识别一首歌曲。");
            return;
          }

          $.ajax({
            url: "/start",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
              mode: "semiauto",
              song_name: songName,
              difficulty: difficulty,
            }),
            success: function (response) {
              if (response.success) {
                logElement.innerHTML += "半自动任务已开始...\n";
              } else {
                logElement.innerHTML += "错误: " + response.message + "\n";
              }
              updateStatus();
            },
          });
        });
      });
    </script>
  </body>
</html>
