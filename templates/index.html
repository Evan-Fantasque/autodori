<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDori WebUI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h1, h2 {
            text-align: center;
            color: #d1a1e4;
        }
        .control-panel, .log-panel {
            background-color: #252526;
            border: 1px solid #37373d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group select, .form-group input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #37373d;
            background-color: #3c3c3c;
            color: #d4d4d4;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-start {
            background-color: #4CAF50;
            color: white;
        }
        .btn-start:hover:not(:disabled) {
            background-color: #45a049;
        }
        .btn-stop {
            background-color: #f44336;
            color: white;
        }
        .btn-stop:hover:not(:disabled) {
            background-color: #da190b;
        }
        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #log-output {
            height: 400px;
            background-color: #1e1e1e;
            border: 1px solid #37373d;
            border-radius: 4px;
            padding: 10px;
            overflow-y: scroll;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #ce9178;
        }
        #status-indicator {
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
        }
        .status-idle { background-color: #555; color: white; }
        .status-running { background-color: #3a8dff; color: white; }
        .status-stopping { background-color: #f5b041; color: black; }
        .status-stopped { background-color: #4CAF50; color: white; }
        .status-error { background-color: #f44336; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AutoDori WebUI</h1>

        <div class="control-panel">
            <h2>控制面板</h2>
            <div id="status-indicator" class="status-idle">状态: 空闲</div>
            <div class="form-group">
                <label for="difficulty">难度 (Difficulty)</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="normal">Normal</option>
                    <option value="hard" selected>Hard</option>
                    <option value="expert">Expert</option>
                    <option value="special">Special</option>
                </select>
            </div>
            <div class="form-group">
                <label for="livemode">演出模式 (Live Mode)</label>
                <select id="livemode">
                    <option value="freelive" selected>自由演出 (Free Live)</option>
                    <option value="challengelive">挑战演出 (Challenge Live)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="liveboost">最低火量 (Min Live Boost)</label>
                <input type="number" id="liveboost" value="1" min="0">
            </div>
            <div class="button-group">
                <button id="start-btn" class="btn btn-start">开始任务</button>
                <button id="stop-btn" class="btn btn-stop" disabled>停止任务</button>
            </div>
        </div>

        <div class="log-panel">
            <h2>日志输出</h2>
            <div id="log-output"></div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const logOutput = document.getElementById('log-output');
        const statusIndicator = document.getElementById('status-indicator');
        const configElements = ['difficulty', 'livemode', 'liveboost'];

        let eventSource;

        function connectToLogStream() {
            if (eventSource) {
                eventSource.close();
            }
            eventSource = new EventSource('/stream');
            eventSource.onmessage = function(event) {
                if (event.data.startsWith(': heartbeat')) return;
                logOutput.textContent += event.data + '\n';
                logOutput.scrollTop = logOutput.scrollHeight;
            };
            eventSource.onerror = function(err) {
                logOutput.textContent += '日志流连接错误，将在3秒后重试...\n';
                eventSource.close();
                setTimeout(connectToLogStream, 3000);
            };
        }

        function setControlsState(running) {
            startBtn.disabled = running;
            stopBtn.disabled = !running;
            configElements.forEach(id => {
                document.getElementById(id).disabled = running;
            });
        }

        function updateStatusIndicator(status) {
            let statusText = '未知';
            switch (status) {
                case 'idle': statusText = '空闲'; break;
                case 'running': statusText = '运行中'; break;
                case 'stopping': statusText = '正在停止'; break;
                case 'stopped': statusText = '已停止'; break;
                case 'error': statusText = '错误'; break;
            }
            statusIndicator.textContent = `状态: ${statusText}`;
            statusIndicator.className = `status-${status}`;
        }

        startBtn.addEventListener('click', () => {
            const config = {
                difficulty: document.getElementById('difficulty').value,
                livemode: document.getElementById('livemode').value,
                liveboost: document.getElementById('liveboost').value,
            };

            fetch('/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    logOutput.textContent = '任务启动...\n';
                } else {
                    logOutput.textContent += `启动失败: ${data.message}\n`;
                }
            });
        });

        stopBtn.addEventListener('click', () => {
            fetch('/stop', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    logOutput.textContent += '正在发送停止信号...\n';
                } else {
                    logOutput.textContent += `停止失败: ${data.message}\n`;
                }
            });
        });

        setInterval(() => {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    const isRunning = data.is_alive;
                    setControlsState(isRunning);
                    updateStatusIndicator(data.status);
                });
        }, 1000);

        // Initial state setup
        connectToLogStream();
        fetch('/status').then(r => r.json()).then(data => {
             setControlsState(data.is_alive);
             updateStatusIndicator(data.status);
        });
    </script>
</body>
</html>
